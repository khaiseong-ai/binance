name: Update Binance funding history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-history.mjs
      - .github/workflows/update-funding-history.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-funding-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-history.mjs
      - name: Update Backpack / Binance Sheet
        env:
          SHEET_WEB_APP_URL: ${{ secrets.SHEET_WEB_APP_URL }}
          SHEET_WEB_APP_SECRET: ${{ secrets.SHEET_WEB_APP_SECRET }}
        run: node scripts/update-sheet.mjs
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funding-history.json
          git diff --cached --quiet || git commit -m "Update Binance funding history"
          git push
